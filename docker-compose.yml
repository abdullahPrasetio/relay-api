version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relay-api
      POSTGRES_USER: relay-api
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay-api -d relay-api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
